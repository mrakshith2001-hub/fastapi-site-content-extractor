services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: extractor
      POSTGRES_DB: extractor
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://extractor:extractor@postgres:5432/extractor
      AUTO_CREATE_SCHEMA: "false"
      S3_ENDPOINT_URL: http://minio:9000
      MIRROR_DIR: /app/data/mirror
    ports:
      - "8000:8000"
    volumes:
      - mirror_data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # One-shot job: creates the versioned bucket and uploads the sample website.
  seed:
    build: .
    env_file: .env.example
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    command: ["python", "-m", "scripts.seed_s3"]
    depends_on:
      minio:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  minio_data:
  pg_data:
  mirror_data:
